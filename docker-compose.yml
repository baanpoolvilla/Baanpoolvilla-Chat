version: '3.9'

services:
  server:
    build: ./apps/server
    restart: unless-stopped
    env_file: apps/server/.env.production
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: apps/server/.env.production
    depends_on:
      - server
